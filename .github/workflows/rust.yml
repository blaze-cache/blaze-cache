# CI for the Rust side of the workspace.
#
# The toolchain, the wasm32 target and the rustfmt/clippy components all come from
# `rust-toolchain.toml` — rustup installs whatever the file declares on first use, so no
# job pins a version here. Two jobs:
#
#   host  — rustfmt, clippy (-D warnings), `cargo test --workspace` (43 unit + 4 doctest)
#   wasm  — `wasm-pack test --node`: the `#[wasm_bindgen_test]` suite in bindings tests.rs
#           against the real wasm-bindgen glue, running in Node (no WebDriver needed).
name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes older runs pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to the commit SHA, with the release in a
      # trailing comment — tags are mutable, SHAs are not (dependabot updates both).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      # Caches ~/.cargo and target/ keyed on Cargo.lock; each job keeps its own cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Cheapest check first so formatting failures surface immediately.
      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tests + doctests
        run: cargo test --workspace --locked

  wasm:
    name: wasm-pack tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Download the release binary ourselves instead of using jetli/wasm-pack-action@v0.4.0:
      # that action `rename`s the binary out of /tmp, and on this runner /tmp sits on a
      # different filesystem than ~/.cargo/bin, so it dies with EXDEV (cross-device link).
      # A copy has no such restriction, the version is pinned, and no third party is involved.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          # Pin the artifact too, not just the version: this is the sha256 of the
          # x86_64-unknown-linux-musl release tarball, hashed locally before pinning.
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      # `wasm-pack test --node` executes the suite under Node; pin it so the runner's
      # preinstalled default can't drift out from under wasm-bindgen-test.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: bindings tests
        run: wasm-pack test --node crates/blaze-cache-wasm

# CI for the JavaScript side: the packages under `packages/`.
#
# Two jobs, kept apart on purpose:
#
#   test  — the offline suites on every push/PR. They run against stub adapters and canned
#           payloads, so they are fully deterministic: no network, no rate limits.
#   live  — the opt-in suites against real public APIs, on a nightly cron and manual
#           dispatch only. GitHub's unauthenticated limit is 60 requests/hour and third
#           parties can be down, slow, or quietly rewriting their headers — none of which
#           should ever fail an unrelated PR.
#
# Rust formatting/clippy stay in rust.yml; this workflow owns wasm + TS + the JS tests.
name: JavaScript

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 03:17 UTC — deliberately off the hour, when scheduled runs are least loaded.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes older runs pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: offline suites
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to the commit SHA, with the release in a
      # trailing comment — tags are mutable, SHAs are not (dependabot updates both).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm's version comes from `packageManager` in package.json — nothing to pin twice.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # Builds the wasm crate: every package test runs against `packages/core/pkg`.
      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Download the release binary ourselves instead of using jetli/wasm-pack-action@v0.4.0:
      # that action `rename`s the binary out of /tmp, and on this runner /tmp sits on a
      # different filesystem than ~/.cargo/bin, so it dies with EXDEV (cross-device link).
      # Same approach as rust.yml, same pinned version.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          # Pin the artifact too, not just the version: this is the sha256 of the
          # x86_64-unknown-linux-musl release tarball, hashed locally before pinning.
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build wasm
        run: pnpm build:wasm

      # Pass counts from the offline suites: core 149, axios 49, ky 66, react-query 39,
      # swr 49, fetch 63, integration-tests 23 — plus the live files, skipped here.
      - name: package tests
        run: pnpm -r test

      - name: typecheck
        run: pnpm typecheck

  # Quick performance gate. The baseline is generated FROM THE BASE REVISION IN THIS SAME JOB,
  # before the PR's head is measured: absolute numbers and per-adapter sensitivity vary far too
  # much between a developer's laptop and a hosted runner for a checked-in cross-machine
  # baseline to mean anything (a 2× difference on one adapter is routine). Only the engine
  # sources are swapped for the base run — the harness, scenarios and peers stay identical — so
  # the comparison isolates the PR's change. The checked-in baseline remains for local runs.
  # Browser suites are published separately (see docs/benchmarks/RESULTS.md): hosted browsers
  # are too noisy for a hard gate.
  bench:
    name: bench:ci (same-runner A/B gate)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base revision is needed for the A/B run

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm + core (PR head)
        run: pnpm build:wasm && pnpm --filter @blaze-cache/core build

      - name: Measure PR head
        run: pnpm --filter blaze-cache-bench bench -- --quick --out=benchmarks/results/current.node.json > /dev/null

      - name: Measure base revision on the same runner
        env:
          # PRs: the base branch tip. Pushes: the commit just before the push. An all-zero
          # SHA (new branch / forced push) means "no base" — fall back to the checked-in
          # baseline rather than failing an otherwise valid run.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "${BASE_SHA#0000000000000000000000000000000000000000}" = "" ]; then
            cp benchmarks/results/baseline.node.json benchmarks/results/base.node.json
            echo "no usable base revision — using the checked-in baseline"
            exit 0
          fi
          # Always restore the PR tree, even if the base build or benchmark fails.
          PR_SHA="$(git rev-parse HEAD)"
          trap 'git checkout --force --detach "$PR_SHA"' EXIT
          # Check out the WHOLE base tree, not just the engine sources. The PR may add a new
          # adapter or opt-in mode; if the harness/scenarios come from the PR but the wasm comes
          # from the base, that adapter measures the base implementation under a PR label and
          # shows up as a 600% "regression". The compare script ignores rows with no baseline.
          #
          # A tree SWITCH, not `git checkout "$BASE_SHA" -- .`: the pathspec form only overwrites
          # paths present in the base and leaves everything else behind. A PR that adds a workspace
          # package (e.g. packages/devtools) therefore keeps its package.json while pnpm-lock.yaml
          # is reverted to the base's, and `pnpm install --frozen-lockfile` fails with
          # ERR_PNPM_OUTDATED_LOCKFILE. The mirror image bites too: files the PR deletes would be
          # resurrected and then survive the restore, since `git checkout HEAD -- .` is equally
          # one-directional. Detaching swaps the entire tree both ways, and the trap set above
          # puts the PR SHA back. Ignored bench outputs (current/base.node.json) are untouched
          # by it.
          git checkout --force --detach "$BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm build:wasm
          pnpm --filter @blaze-cache/core build
          pnpm --filter blaze-cache-bench bench -- --quick --out=benchmarks/results/base.node.json > /dev/null
          # the EXIT trap restores the PR tree

      - name: Compare (scenario-normalised, outlier-trimmed)
        run: node scripts/compare-bench.mjs benchmarks/results/current.node.json benchmarks/results/base.node.json

  live:
    name: live network suites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          # Pin the artifact too, not just the version: this is the sha256 of the
          # x86_64-unknown-linux-musl release tarball, hashed locally before pinning.
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test:live` = build:wasm + every workspace `test:live` script (pnpm -r):
      # the live suites (fetch, axios, ky, ofetch, swr, react-query, integration-tests)
      # and core's own. Core runs first (topological order) and its script builds
      # `packages/core/dist` — the other packages resolve `@blaze-cache/core` through
      # those built declarations, which is why core cannot simply be skipped here.
      # BLAZE_CACHE_LIVE is set by each package's script, so a bare runner has to opt in
      # exactly like a developer does.
      - name: live suites (real public APIs)
        run: pnpm test:live

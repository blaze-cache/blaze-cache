# CI for the JavaScript side: the packages under `packages/`.
#
# Two jobs, kept apart on purpose:
#
#   test  — the offline suites on every push/PR. They run against stub adapters and canned
#           payloads, so they are fully deterministic: no network, no rate limits.
#   live  — the opt-in suites against real public APIs, on a nightly cron and manual
#           dispatch only. GitHub's unauthenticated limit is 60 requests/hour and third
#           parties can be down, slow, or quietly rewriting their headers — none of which
#           should ever fail an unrelated PR.
#
# Rust formatting/clippy stay in rust.yml; this workflow owns wasm + TS + the JS tests.
name: JavaScript

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, 03:17 UTC — deliberately off the hour, when scheduled runs are least loaded.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes older runs pointless — cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: offline suites
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to the commit SHA, with the release in a
      # trailing comment — tags are mutable, SHAs are not (dependabot updates both).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm's version comes from `packageManager` in package.json — nothing to pin twice.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # Builds the wasm crate: every package test runs against `packages/core/pkg`.
      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Download the release binary ourselves instead of using jetli/wasm-pack-action@v0.4.0:
      # that action `rename`s the binary out of /tmp, and on this runner /tmp sits on a
      # different filesystem than ~/.cargo/bin, so it dies with EXDEV (cross-device link).
      # Same approach as rust.yml, same pinned version.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          # Pin the artifact too, not just the version: this is the sha256 of the
          # x86_64-unknown-linux-musl release tarball, hashed locally before pinning.
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build wasm
        run: pnpm build:wasm

      # Pass counts from the offline suites: core 62, axios 35, ky 60, react-query 39,
      # swr 28, fetch 46, integration-tests 16 — plus the live files, skipped here.
      - name: package tests
        run: pnpm -r test

      - name: typecheck
        run: pnpm typecheck

  live:
    name: live network suites
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
          # Pin the artifact too, not just the version: this is the sha256 of the
          # x86_64-unknown-linux-musl release tarball, hashed locally before pinning.
          WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install -m 755 "/tmp/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/wasm-pack" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test:live` = build:wasm + every workspace `test:live` script (pnpm -r):
      # the live suites (fetch, axios, ky, ofetch, swr, react-query, integration-tests)
      # and core's own. Core runs first (topological order) and its script builds
      # `packages/core/dist` — the other packages resolve `@blaze-cache/core` through
      # those built declarations, which is why core cannot simply be skipped here.
      # BLAZE_CACHE_LIVE is set by each package's script, so a bare runner has to opt in
      # exactly like a developer does.
      - name: live suites (real public APIs)
        run: pnpm test:live
